# teleop_server (telemetry-only) configuration.
# Self-contained Zenoh router + telemetry topic prefix (nev/teleop/...),
# split from stream_server.

# Zenoh router listen port. TCP-only — bot and client both connect over
# tcp/host:7447 (RELIABLE qos). UDP listener was removed as no peer ever
# used it.
zenoh_tcp_port: 7447

# Telemetry push frequency (Hz)
telemetry_rate:       2.0
# Station heartbeat timeout (sec) — no client_heartbeat received
station_timeout:      3.0

# Keys that update last_control_recv timestamp
control_keys:
  - mux
  - twist
  - network
  - estop

# Robot disconnect threshold (sec)
disconnect_timeout:   3.0
# Bandwidth calculation cycle (sec)
bw_calc_interval:     1.0
# Sequence number wrap limit (uint16)
seq_max:              65536

# Embedded /healthz + /metrics HTTP endpoint (aiohttp).
# Bound to localhost by default — see README "Monitoring" before exposing.
metrics:
  enabled: true
  bind: "127.0.0.1"
  port: 8080
