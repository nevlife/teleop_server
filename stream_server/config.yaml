# stream_server — TCP-only video relay.
# Contract: /home/nev/teleop/TCP_WIRE_SPEC.md (v0.1).
# Topics: nev/stream_tcp/{vehicle_id}/...
# Router: TCP 7457 only (UDP path explicitly removed).

# Self-telemetry identifier. video_ping is sent to this vehicle_id even
# before the first camera frame arrives so RTT measurement can start
# immediately.
vehicle_id: "0"

# Stream router listen port. TCP only — TCP_WIRE_SPEC §1.
zenoh_tcp_port: 7447

# server -> bot video_ping cadence (Hz). RTT signal for the BitrateController.
video_ping_rate: 1.0
# stream_heartbeat (client -> server) timeout (sec). On timeout we mark the
# client disconnected; on the reconnect rising edge we reset the dedupe cache.
client_heartbeat_timeout: 3.0
# No camera frames / pong from the bot for this long => "disconnected".
# Triggers dedupe reset so the first reconnect frame (vehicle_ts ~ small) is
# not falsely matched against pre-disconnect cache entries.
bot_disconnect_timeout: 3.0
# RX byte bandwidth roll-up cycle (sec). The send loop polls faster than this
# but the calc_bandwidth method gates itself to a 1 s window.
bw_calc_interval: 1.0

# Adaptive bitrate. TCP_WIRE_SPEC §9 — only put_latency + RTT signals, no
# loss path. The spec mandates RELIABLE+BLOCK on every publisher so loss is
# always zero and would be dead code here.
video:
  enabled:              true
  initial_kbps:         2500
  min_kbps:             200
  max_kbps:             3000
  # Spec §9: -20% on threshold trip, +10% on sustained sub-50% headroom.
  decrease_factor:      0.8
  recovery_factor:      1.1
  put_latency_high_ms:  80.0
  rtt_high_ms:          200.0
  # "Both below 50% of limit" is the recovery trigger.
  put_latency_low_ms:   40.0
  rtt_low_ms:           100.0
  # Spec §9: 5 s dwell between any change, 30 s sustained-low for recovery.
  dwell_s:              5.0
  recovery_dwell_s:     30.0
  # 1 s window for percentile computation on put_latency and RTT.
  window_s:             1.0
  # Spec §13 sanity: AU drop bounds.
  au_min_bytes:         16
  au_max_bytes:         1048576       # 1 MiB
  vehicle_ts_min:       1.0e6
  vehicle_ts_future_s:  10.0
  # OrderedDict-per-(vid,cam) dedupe cache size.
  dedupe_cache_size:    1024
  # Camera entry pruning: drop a camera's per-(vid,cam) maps after this many
  # seconds of no AU.
  camera_stale_s:       5.0
