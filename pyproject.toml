[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teleop_relay"
version = "0.3.0"
description = "NEV teleop WebRTC signaling server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
teleop-server = "teleop_v2_server.main:main"
teleop-v2-server = "teleop_v2_server.main:main"

[tool.setuptools]
packages = ["teleop_v2_server"]

[tool.black]
line-length = 99
target-version = ["py310"]
